<script>
  (function () {
    'use strict';

    var loadingEl = document.getElementById('results-loading');
    var errorEl = document.getElementById('results-error');
    var contentEl = document.getElementById('results-content');
    var totalEl = document.getElementById('results-total');
    var updatedAtEl = document.getElementById('results-updated-at');
    var pendingEl = document.getElementById('results-pending');
    var blocksEl = document.getElementById('results-blocks');

    var charts = {
      categories: document.getElementById('chart-categories'),
      primaryInterestCategory: document.getElementById('chart-primary-interest-category'),
      engagement: document.getElementById('chart-engagement'),
      region: document.getElementById('chart-region'),
      age: document.getElementById('chart-age'),
      snbcAwareness: document.getElementById('chart-snbc-awareness'),
      snbcInterest: document.getElementById('chart-snbc-interest'),
      snbcUncertainReasons: document.getElementById('chart-snbc-uncertain-reasons'),
      step3Frequency: document.getElementById('chart-step3-frequency'),
      step3Price: document.getElementById('chart-step3-price'),
      step3GroupSize: document.getElementById('chart-step3-group-size'),
      step3Format: document.getElementById('chart-step3-format'),
      step3EventAwareness: document.getElementById('chart-step3-event-awareness'),
      step3Barriers: document.getElementById('chart-step3-barriers'),
      step3HelpfulInfo: document.getElementById('chart-step3-helpful-info'),
      step3Atmosphere: document.getElementById('chart-step3-atmosphere'),
      step3HypotheticalIntent: document.getElementById('chart-step3-hypothetical-intent'),
      step3Gap: document.getElementById('chart-step3-gap'),
      gapReasons: document.getElementById('chart-gap-reasons'),
      suitEngagement: document.getElementById('chart-suit-engagement'),
      suitTypes: document.getElementById('chart-suit-types'),
      suitStates: document.getElementById('chart-suit-states'),
      suitEventInterest: document.getElementById('chart-suit-event-interest')
    };

    // Issue #315：分岐設問ブロック（ティア1/2でサーバー側が対象者数未満のとき丸ごと省略する）の
    // 表示・非表示・対象者数表示をまとめて扱うヘルパー群。
    var blockSnbcUncertainReasons = document.getElementById('block-snbc-uncertain-reasons');
    var sectionStep3Conditions = document.getElementById('section-step3-conditions');
    var sectionStep3Barriers = document.getElementById('section-step3-barriers');
    var blockGapReasons = document.getElementById('block-gap-reasons');
    var sectionSuit = document.getElementById('section-suit');

    /**
     * data[key]が存在するときだけtoggleEl（<section>や<details>）を表示し、
     * targetElIds（対象者数を表示する<span>のidの配列）へtargetCountを書き込む。
     * data[key]が無い（サーバー側でティア閾値未満のため省略された）場合は非表示のまま。
     */
    function showBranchBlock(toggleEl, data, targetElIds) {
      var present = !!data;
      toggleEl.hidden = !present;
      if (present) {
        toggleEl.open = true;
        (targetElIds || []).forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.textContent = data.targetCount;
        });
      }
    }

    var hasRenderedOnce = false;

    function formatTime(isoString) {
      var date = new Date(isoString);
      if (isNaN(date.getTime())) return '--';
      var hours = ('0' + date.getHours()).slice(-2);
      var minutes = ('0' + date.getMinutes()).slice(-2);
      return (date.getMonth() + 1) + '/' + date.getDate() + ' ' + hours + ':' + minutes;
    }

    function clearChildren(el) {
      while (el.firstChild) el.removeChild(el.firstChild);
    }

    /**
     * items: [{ name, count, percent }, ...]（buildPublicSimpleBreakdown_と同じ形。件数昇順は既にサーバー側で降順ソート済み）。
     */
    function renderBarChart(container, items) {
      clearChildren(container);

      if (!items || items.length === 0) {
        var empty = document.createElement('p');
        empty.className = 'result-block__empty';
        empty.textContent = '表示できるデータがまだありません。';
        container.appendChild(empty);
        return;
      }

      items.forEach(function (item) {
        var row = document.createElement('div');
        row.className = 'bar-row';

        var label = document.createElement('div');
        label.className = 'bar-row__label';

        var name = document.createElement('span');
        name.className = 'bar-row__name';
        name.textContent = item.name;

        var value = document.createElement('span');
        value.className = 'bar-row__value';
        value.textContent = item.count + '件（' + item.percent + '%）';

        label.appendChild(name);
        label.appendChild(value);

        var track = document.createElement('div');
        track.className = 'bar-row__track';

        var fill = document.createElement('div');
        fill.className = 'bar-row__fill';
        fill.style.width = Math.max(0, Math.min(100, item.percent)) + '%';

        track.appendChild(fill);
        row.appendChild(label);
        row.appendChild(track);
        container.appendChild(row);
      });
    }

    function render(data) {
      loadingEl.hidden = true;
      errorEl.hidden = true;
      contentEl.hidden = false;

      totalEl.textContent = data.total;
      updatedAtEl.textContent = formatTime(data.generatedAt);

      if (!data.ready) {
        pendingEl.hidden = false;
        blocksEl.hidden = true;
      } else {
        pendingEl.hidden = true;
        blocksEl.hidden = false;
        renderBarChart(charts.categories, data.categories);
        // Issue #315（追加対応）：第一嗜好は分岐設問ではなく常に表示する（分母は総回答数）。
        renderBarChart(charts.primaryInterestCategory, data.primaryInterestCategory);
        renderBarChart(charts.engagement, data.engagement);
        renderBarChart(charts.region, data.region);
        renderBarChart(charts.age, data.age);

        // Issue #315：SNBC認知・興味はサーバー側で対象者数によるブロック非表示を行わない
        // （総回答数ゲートのみに従う）ため、常に描画する。分母は対象者数（targetCount）。
        renderBarChart(charts.snbcAwareness, data.snbcAwareness.items);
        document.getElementById('target-snbc-awareness').textContent = data.snbcAwareness.targetCount;
        renderBarChart(charts.snbcInterest, data.snbcInterest.items);
        document.getElementById('target-snbc-interest').textContent = data.snbcInterest.targetCount;

        // ── ここから、対象者数がティア閾値未満のときサーバー側でpayloadから丸ごと省略される
        //    分岐ブロック（Issue #315）。showBranchBlockがdata[key]の有無で表示・非表示を切り替える。
        showBranchBlock(blockSnbcUncertainReasons, data.snbcUncertainReasons, ['target-snbc-uncertain-reasons']);
        if (data.snbcUncertainReasons) renderBarChart(charts.snbcUncertainReasons, data.snbcUncertainReasons.items);

        var hasStep3 = !!data.step3;
        showBranchBlock(sectionStep3Conditions, data.step3, ['target-step3-conditions']);
        showBranchBlock(sectionStep3Barriers, data.step3, ['target-step3-barriers']);
        if (hasStep3) {
          renderBarChart(charts.step3Frequency, data.step3.frequency);
          renderBarChart(charts.step3Price, data.step3.price);
          renderBarChart(charts.step3GroupSize, data.step3.groupSize);
          renderBarChart(charts.step3Format, data.step3.format);
          renderBarChart(charts.step3EventAwareness, data.step3.eventAwareness);
          renderBarChart(charts.step3Barriers, data.step3.barriers);
          renderBarChart(charts.step3HelpfulInfo, data.step3.helpfulInformation);
          renderBarChart(charts.step3Atmosphere, data.step3.atmosphere);
          renderBarChart(charts.step3HypotheticalIntent, data.step3.hypotheticalIntent);
          renderBarChart(charts.step3Gap, data.step3.gap);
        }

        showBranchBlock(blockGapReasons, data.gapReasons, ['target-gap-reasons']);
        if (data.gapReasons) renderBarChart(charts.gapReasons, data.gapReasons.items);

        showBranchBlock(sectionSuit, data.suit, ['target-suit']);
        if (data.suit) {
          renderBarChart(charts.suitEngagement, data.suit.engagement);
          renderBarChart(charts.suitTypes, data.suit.types);
          renderBarChart(charts.suitStates, data.suit.states);
          renderBarChart(charts.suitEventInterest, data.suit.eventInterest);
        }
      }

      hasRenderedOnce = true;
    }

    function showError() {
      // 確定結果は固定スナップショットのため再取得（ポーリング）はしない。未確定・取得失敗時はエラー表示。
      if (!hasRenderedOnce) {
        loadingEl.hidden = true;
        errorEl.hidden = false;
      }
    }

    function fetchResults() {
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(showError)
        .getPublicResults();
    }

    fetchResults();
  })();
</script>
