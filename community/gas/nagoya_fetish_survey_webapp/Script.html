  /* ══════════════════════════════════════════════════════════════
   * ブラウザUUID：localStorage / Cookie 両方に保存し、片方が消えても復元できるようにする
   * ══════════════════════════════════════════════════════════════ */

  var UUID_STORAGE_KEY = 'survey_browser_uuid';
  var COOKIE_MAX_AGE_SECONDS = 60 * 60 * 24 * 400; // 約400日（主要ブラウザのCookie上限に合わせた「最低1年程度」の実質最大値）

  function generateUuid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return fallbackUuidV4();
  }

  // crypto.randomUUID()非対応ブラウザ向けフォールバック。
  // crypto.getRandomValues()（暗号学的乱数）が使える場合はそれを使い、
  // 完全に使えない極めて古い環境でのみMath.randomにフォールバックする。
  function fallbackUuidV4() {
    var bytes = new Uint8Array(16);
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
      window.crypto.getRandomValues(bytes);
    } else {
      for (var i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    bytes[6] = (bytes[6] & 0x0f) | 0x40; // version 4
    bytes[8] = (bytes[8] & 0x3f) | 0x80; // variant 10

    var hex = [];
    for (var j = 0; j < 256; j++) hex[j] = (j + 0x100).toString(16).slice(1);

    return (
      hex[bytes[0]] + hex[bytes[1]] + hex[bytes[2]] + hex[bytes[3]] + '-' +
      hex[bytes[4]] + hex[bytes[5]] + '-' +
      hex[bytes[6]] + hex[bytes[7]] + '-' +
      hex[bytes[8]] + hex[bytes[9]] + '-' +
      hex[bytes[10]] + hex[bytes[11]] + hex[bytes[12]] + hex[bytes[13]] + hex[bytes[14]] + hex[bytes[15]]
    );
  }

  function readLocalStorage(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      // プライベートブラウズ等でlocalStorageへのアクセス自体が例外になる環境がある。
      return null;
    }
  }

  function writeLocalStorage(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {
      // 書き込み失敗は無視する（Cookie側が代替として機能する場合がある）。
    }
  }

  function readCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function writeCookie(name, value) {
    // Apps ScriptのWebアプリは常時HTTPSで配信されるためSecureを付与できる。
    // SameSite=Laxはトップレベル遷移でのCookie送信を許可しつつCSRF的なリスクを抑える設定。
    var attrs = 'path=/; max-age=' + COOKIE_MAX_AGE_SECONDS + '; SameSite=Lax; Secure';
    document.cookie = name + '=' + encodeURIComponent(value) + '; ' + attrs;
  }

  /**
   * ブラウザUUIDの復元・発行ルール（仕様理由）：
   * 1. localStorageにUUIDがある → それを採用する。
   *    Cookie側の値と食い違っていても、新規UUIDは発行せずlocalStorage側を正としてCookieを同期する。
   *    （理由：Cookieは有効期限切れ・サードパーティCookie制限などで消えたり
   *    分離されたりしやすく、localStorageの方が同一ブラウザでの継続性が高いと判断したため。
   *    ここで新規UUIDを発行してしまうと、Cookieだけが何らかの理由で書き換わった
   *    ケースで毎回別人扱いになってしまう）。
   * 2. localStorageが空でCookieがある → Cookieの値を採用し、localStorageにも保存する
   *    （localStorageのみ消去された場合の復元）。
   * 3. 両方とも空 → 新規UUIDを生成し、両方に保存する。
   */
  function resolveBrowserUuid() {
    var localValue = readLocalStorage(UUID_STORAGE_KEY);
    var cookieValue = readCookie(UUID_STORAGE_KEY);

    if (localValue) {
      if (cookieValue !== localValue) {
        writeCookie(UUID_STORAGE_KEY, localValue);
      }
      return localValue;
    }

    if (cookieValue) {
      writeLocalStorage(UUID_STORAGE_KEY, cookieValue);
      return cookieValue;
    }

    var newUuid = generateUuid();
    writeLocalStorage(UUID_STORAGE_KEY, newUuid);
    writeCookie(UUID_STORAGE_KEY, newUuid);
    return newUuid;
  }

  /* ══════════════════════════════════════════════════════════════
   * フォーム描画
   * ══════════════════════════════════════════════════════════════ */

  var browserUuid = null;

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'text') node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  function renderQuestions() {
    var container = document.getElementById('questions');
    container.innerHTML = '';

    QUESTIONS.forEach(function (question, index) {
      if (question.sectionNote) {
        container.appendChild(el('div', { class: 'notice-box' }, [
          el('p', { text: question.sectionNote })
        ]));
      }

      var legend = el('legend', {}, [document.createTextNode(question.label)]);
      if (question.required) {
        legend.appendChild(el('span', { class: 'q-required', text: '必須' }));
      }

      var card = el('fieldset', { class: 'q-card', 'data-key': question.key });
      card.appendChild(legend);
      if (question.help) {
        card.appendChild(el('p', { class: 'q-help', text: question.help }));
      }

      var record = { card: card, inputs: [], otherCheckbox: null, otherText: null };

      if (question.type === 'select') {
        var select = el('select', { class: 'q-select', id: 'field-' + question.key });
        select.appendChild(el('option', { value: '' }, [document.createTextNode('選択してください')]));
        question.options.forEach(function (opt) {
          select.appendChild(el('option', { value: opt }, [document.createTextNode(opt)]));
        });
        select.addEventListener('change', function () {
          setValue(question.key, select.value);
        });
        card.appendChild(select);
        record.inputs.push(select);
      } else if (question.type === 'radio' || question.type === 'checkbox') {
        var optionsWrap = el('div', { class: 'q-options' });
        var inputType = question.type === 'radio' ? 'radio' : 'checkbox';
        var groupName = 'field-' + question.key;

        question.options.forEach(function (opt, optIndex) {
          var input = el('input', {
            type: inputType,
            name: groupName,
            id: groupName + '-' + optIndex,
            value: opt
          });
          input.addEventListener('change', function () { onOptionChange(question); });
          var label = el('label', { class: 'q-option', for: input.id }, [
            input, el('span', { text: opt })
          ]);
          optionsWrap.appendChild(label);
          record.inputs.push(input);
        });

        if (question.allowOther) {
          var otherInput = el('input', {
            type: inputType,
            name: groupName,
            id: groupName + '-other',
            value: OTHER_VALUE
          });
          otherInput.addEventListener('change', function () {
            otherText.disabled = !otherInput.checked;
            if (!otherInput.checked) otherText.value = '';
            onOptionChange(question);
          });
          var otherLabel = el('label', { class: 'q-option', for: otherInput.id }, [
            otherInput, el('span', { text: 'その他' })
          ]);
          optionsWrap.appendChild(otherLabel);
          record.inputs.push(otherInput);
          record.otherCheckbox = otherInput;

          var otherText = el('input', {
            type: 'text',
            class: 'q-other-text',
            maxlength: '100',
            placeholder: '自由にご記入ください',
            disabled: 'disabled'
          });
          otherText.addEventListener('input', function () { onOptionChange(question); });
          record.otherText = otherText;
          card.appendChild(optionsWrap);
          card.appendChild(otherText);
        } else {
          card.appendChild(optionsWrap);
        }
      } else if (question.type === 'textarea') {
        var textarea = el('textarea', {
          class: 'q-textarea',
          id: 'field-' + question.key,
          maxlength: '300'
        });
        textarea.addEventListener('input', function () {
          setValue(question.key, textarea.value);
        });
        card.appendChild(textarea);
        record.inputs.push(textarea);
      }

      var errorEl = el('p', { class: 'q-error', text: 'この項目は必須です。' });
      card.appendChild(errorEl);
      record.errorEl = errorEl;

      fieldElements[question.key] = record;
      container.appendChild(card);
    });

    applyConditions();
  }

  function onOptionChange(question) {
    if (question.type === 'radio') {
      var record = fieldElements[question.key];
      var selected = record.inputs.filter(function (i) { return i.checked; })[0];
      if (!selected) {
        setValue(question.key, '');
      } else if (question.allowOther && selected === record.otherCheckbox) {
        setValue(question.key, OTHER_PREFIX + record.otherText.value.trim());
      } else {
        setValue(question.key, selected.value);
      }
    } else if (question.type === 'checkbox') {
      var rec = fieldElements[question.key];
      var values = [];
      rec.inputs.forEach(function (input) {
        if (!input.checked) return;
        if (question.allowOther && input === rec.otherCheckbox) {
          values.push(OTHER_PREFIX + rec.otherText.value.trim());
        } else {
          values.push(input.value);
        }
      });
      setValue(question.key, values);
    }
  }

  /**
   * すべての値変更（select/radio/checkbox/textareaいずれも）はここを経由するため、
   * 条件付き表示（applyConditions）の再評価も常にここで行う。
   * select（都道府県）の変更でaichiAreaの表示条件が変わるケースを取りこぼさないよう、
   * 個々のイベントハンドラ側では呼ばずここに一本化している。
   */
  function setValue(key, value) {
    currentValues[key] = value;
    clearFieldError(key);
    applyConditions();
  }

  /**
   * condition() を持つ設問（aichiArea / gapReasons）の表示・非表示を切り替える。
   * 非表示にする際は入力値も初期値へ戻す（画面から消えた設問の古い値が
   * 送信されないようにするため）。
   */
  function applyConditions() {
    QUESTIONS.forEach(function (question) {
      if (!question.condition) return;
      var visible = question.condition(currentValues);
      var record = fieldElements[question.key];
      record.card.hidden = !visible;
      if (!visible) {
        resetFieldInputs(question);
        currentValues[question.key] = initialValueFor(question);
        clearFieldError(question.key);
      }
    });
  }

  function resetFieldInputs(question) {
    var record = fieldElements[question.key];
    record.inputs.forEach(function (input) {
      if (input.type === 'radio' || input.type === 'checkbox') input.checked = false;
      else input.value = '';
    });
    if (record.otherText) {
      record.otherText.value = '';
      record.otherText.disabled = true;
    }
  }

  function clearFieldError(key) {
    var record = fieldElements[key];
    if (record) record.card.classList.remove('q-card--invalid');
  }

  /* ══════════════════════════════════════════════════════════════
   * バリデーション・送信データの組み立て
   * ══════════════════════════════════════════════════════════════ */

  function isQuestionVisible(question) {
    return !question.condition || question.condition(currentValues);
  }

  function validateForm() {
    var firstInvalidCard = null;

    QUESTIONS.forEach(function (question) {
      var record = fieldElements[question.key];
      record.card.classList.remove('q-card--invalid');
      if (!question.required || !isQuestionVisible(question)) return;

      var value = currentValues[question.key];
      var invalid = question.type === 'checkbox' ? value.length === 0 : value === '';

      // 「その他」を選んだのに自由記述が空、も不正として扱う。
      if (!invalid && record.otherCheckbox && record.otherCheckbox.checked && record.otherText.value.trim() === '') {
        invalid = true;
      }

      if (invalid) {
        record.card.classList.add('q-card--invalid');
        if (!firstInvalidCard) firstInvalidCard = record.card;
      }
    });

    // 必須ではない設問でも、「その他」を選んだのに自由記述が空の場合は不正とする。
    QUESTIONS.forEach(function (question) {
      if (question.required || !isQuestionVisible(question)) return;
      var record = fieldElements[question.key];
      if (record.otherCheckbox && record.otherCheckbox.checked && record.otherText.value.trim() === '') {
        record.card.classList.add('q-card--invalid');
        if (!firstInvalidCard) firstInvalidCard = record.card;
      }
    });

    if (firstInvalidCard) {
      // 古いWebView等でscrollIntoViewが無い場合でも送信ブロック自体は成立させる
      // （ここで例外になるとvalidateForm()全体が失敗し、意図せず送信されてしまうため）。
      if (typeof firstInvalidCard.scrollIntoView === 'function') {
        try {
          firstInvalidCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (scrollError) {
          firstInvalidCard.scrollIntoView();
        }
      }
      return false;
    }
    return true;
  }

  function buildAnswersPayload() {
    return {
      prefecture: currentValues.prefecture,
      aichiArea: currentValues.aichiArea,
      age: currentValues.age,
      clothingInterests: currentValues.clothingInterests,
      preferredFrequency: currentValues.preferredFrequency,
      preferredPrice: currentValues.preferredPrice,
      preferredGroupSize: currentValues.preferredGroupSize,
      preferredFormat: currentValues.preferredFormat,
      eventAwareness: currentValues.eventAwareness,
      barriers: currentValues.barriers,
      helpfulInformation: currentValues.helpfulInformation,
      preferredAtmosphere: currentValues.preferredAtmosphere,
      hypotheticalIntent: currentValues.hypotheticalIntent,
      surveyToSignupGap: currentValues.surveyToSignupGap,
      gapReasons: currentValues.gapReasons,
      freeComment: currentValues.freeComment
    };
  }

  /* ══════════════════════════════════════════════════════════════
   * 画面状態の切り替え
   * ══════════════════════════════════════════════════════════════ */

  function showOnly(id) {
    ['loading', 'already-answered', 'load-error', 'submitted', 'survey-form'].forEach(function (elementId) {
      document.getElementById(elementId).hidden = elementId !== id;
    });
  }

  function setFormError(message) {
    var errorEl = document.getElementById('form-error');
    if (message) {
      errorEl.textContent = message;
      errorEl.hidden = false;
    } else {
      errorEl.hidden = true;
      errorEl.textContent = '';
    }
  }

  /* ══════════════════════════════════════════════════════════════
   * 起動処理
   * ══════════════════════════════════════════════════════════════ */

  function init() {
    try {
      renderQuestions();
      browserUuid = resolveBrowserUuid();
    } catch (renderError) {
      // フォーム描画やUUID解決自体で例外が起きると「読み込み中」のまま止まってしまうため、
      // ここだけは明示的にエラー表示へ切り替える。
      showOnly('load-error');
      return;
    }

    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.answered) {
          showOnly('already-answered');
        } else {
          showOnly('survey-form');
        }
      })
      .withFailureHandler(function () {
        // 状態確認自体が失敗しても、最終的な二重回答防止はsubmitSurvey側のサーバー判定が
        // 担保するため、フォームは表示する（ユーザーを不必要にブロックしない）。
        showOnly('survey-form');
      })
      .checkSubmissionStatus(browserUuid);
  }

  function onSubmit(event) {
    event.preventDefault();
    setFormError('');

    if (!validateForm()) return;

    var submitButton = document.getElementById('submit-button');
    submitButton.disabled = true;
    submitButton.textContent = '送信中…';

    // サーバーからSUCCESS / DUPLICATE / ERRORのいずれかが返るまで、
    // ボタンを無効化したまま再送信を防ぐ（通常の二重クリック対策）。
    // 最終的な重複判定はサーバー側のLockService内で必ず行われる。
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.status === 'SUCCESS') {
          showOnly('submitted');
        } else if (result && result.status === 'DUPLICATE') {
          showOnly('already-answered');
        } else {
          submitButton.disabled = false;
          submitButton.textContent = '回答を送信する';
          setFormError('送信できませんでした。入力内容をご確認のうえ、もう一度お試しください。');
        }
      })
      .withFailureHandler(function () {
        submitButton.disabled = false;
        submitButton.textContent = '回答を送信する';
        setFormError('通信エラーが発生しました。時間をおいて再度お試しください。');
      })
      .submitSurvey(browserUuid, buildAnswersPayload());
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('survey-form').addEventListener('submit', onSubmit);
    init();
  });
})();
</script>
