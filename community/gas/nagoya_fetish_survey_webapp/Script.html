<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════════
   * 設問・選択肢の定義
   * Code.gs側のALLOWED配列と必ず一致させること（サーバー側で必ず再検証されるため、
   * ここだけを書き換えても選択肢を追加できない。両方を同時に更新すること）。
   * ══════════════════════════════════════════════════════════════ */

  var OTHER_PREFIX = 'その他:';

    '新潟県', '富山県', '石川県', '福井県', '山梨県', '長野県', '岐阜県',
    '静岡県', '愛知県', '三重県', '滋賀県', '京都府', '大阪府', '兵庫県',
    '奈良県', '和歌山県', '鳥取県', '島根県', '岡山県', '広島県', '山口県',
    '徳島県', '香川県', '愛媛県', '高知県', '福岡県', '佐賀県', '長崎県',
    '熊本県', '大分県', '宮崎県', '鹿児島県', '沖縄県', '海外'
  ];

  // Q1で愛知県を選んだ人だけに表示する設問のため、「愛知県外」は選択肢に含めない
  // （Code.gs側のAICHI_AREA_OPTIONSと必ず一致させること）。
  var AICHI_AREA_OPTIONS = [

    '東三河地域', 'わからない・その他'

  var AGE_OPTIONS = [

  // ── Issue #293：interest_categories（Q4相当）── Code.gs側と必ず一致させること。
  // 視覚的にスポーツ・ユニフォーム系／制服・職業服系／コスプレ・キャラクター系の

  var INTEREST_SPORTS_OPTIONS = [

    '水泳・競泳ウェア（競パン以外）', 'レスリング・シングレット',
    'ジャージ・トレーニングウェア', '体操服'
  ];

  var INTEREST_UNIFORM_JOB_OPTIONS = [
    '学校制服', 'スーツ', '作業着', '職業制服'
  ];

  var INTEREST_COSPLAY_OPTIONS = [
    '全身タイツ', 'ヒーロー系', '悪役・ヴィラン系', '特撮系', 'コスプレ衣装',
    'アニメ・ゲームキャラクター', 'ケモノ・着ぐるみ・獣人系', 'マスク・覆面系'
  ];

  var INTEREST_CATEGORY_OPTIONS = INTEREST_SPORTS_OPTIONS
    .concat(INTEREST_UNIFORM_JOB_OPTIONS)
    .concat(INTEREST_COSPLAY_OPTIONS);

  // STEP2（SNBCユニ会）のゲート条件。「スーツ」は含めない（Code.gs側と必ず一致させること）。
  var UNIFORM_GATE_CATEGORIES = INTEREST_SPORTS_OPTIONS.concat(['学校制服', '作業着', '職業制服']);
  var SUIT_GATE_CATEGORY = 'スーツ';

  var ENGAGEMENT_OPTIONS = [
    '自分で着たい', '人が着ているのを見たい', '両方',
    '撮る側として関わりたい', '撮られる側として関わりたい', '交流のきっかけとして楽しみたい'
  ];

  var SNBC_AWARENESS_OPTIONS = ['知っている', '名前だけ見たことがある', '知らなかった'];
  var SNBC_INTEREST_OPTIONS = ['はい', 'いいえ', 'どちらともいえない'];
  var SNBC_UNCERTAIN_REASON_OPTIONS = [
    'どんな企画かまだよく分からない', '参加者の雰囲気が分からない', '名古屋まで遠い',
    '料金や内容が分からない', '自分向けか分からない'
  ];

  var SUIT_ENGAGEMENT_OPTIONS = [
    '自分で着たい', '人が着ているのを見たい', '両方',
    '撮る側として関わりたい', '撮られる側として関わりたい'
  ];

  var SUIT_TYPES_OPTIONS = [
    'ビジネススーツ', 'リクルート・就活系', 'タイト・細身', 'ダブル・セットアップ',
    '礼服・フォーマル', 'ホスト・ナイト系', '教師・営業など職業のスーツ', 'ワイシャツ・ネクタイ'
  ];

  var SUIT_STATES_OPTIONS = [
    'ジャケットを着たまま', 'ワイシャツ・ネクタイ', 'ベスト / スラックス / 革靴・ベルト',
    '着崩し', '脱ぐ過程', '着たままの空気'
  ];

  var SUIT_EVENT_INTEREST_OPTIONS = ['はい', 'いいえ', 'どちらともいえない'];

  // 回答者の状態遷移から機械的に決まる値（Code.gs側の
  // computeExpectedSurveyPath_ / computeExpectedCompletionStage_ と必ず一致させること）。
  function hasUniformGate(values) {
    return (values.interestCategories || []).some(function (c) { return UNIFORM_GATE_CATEGORIES.indexOf(c) !== -1; });
  }
  function hasSuitGate(values) {
    return (values.interestCategories || []).indexOf(SUIT_GATE_CATEGORY) !== -1;
  }
  // primaryInterestCategory（Q5）の候補：Q4の選択から「その他」の自由記述を除いたもの。
  // dynamicOptionsとcondition両方から参照し、判定基準がずれないようにする。
  function primaryInterestCandidates(values) {
    return (values.interestCategories || []).filter(function (v) { return v.indexOf(OTHER_PREFIX) !== 0; });
  }
  function deepDiveTriggered(values) {
    return (hasUniformGate(values) && values.snbcInterest === 'はい') ||
      (hasSuitGate(values) && values.suitEventInterest === 'はい');
  }
  // 深掘り一式（STEP3）は、実際にどちらの経路から発火したかで冒頭の案内文を出し分ける
  // （PR #294レビュー指摘：ゲートに該当しているだけでは発火の理由にならないため、
  // 「snbc_interest=はい」「suit_event_interest=はい」の実際の値で判定する）。
  function deepDiveIntroText(values) {
    var uniformTriggered = hasUniformGate(values) && values.snbcInterest === 'はい';
    var suitTriggered = hasSuitGate(values) && values.suitEventInterest === 'はい';
    var subject = 'SNBCのユニフォーム企画';
    if (uniformTriggered && suitTriggered) subject = 'SNBCのユニフォーム企画・スーツ企画';
    else if (suitTriggered) subject = 'スーツ企画';
    return 'ここからは、' + subject + 'に興味があると回答した方へ、参加しやすさについてもう少し詳しく伺います。' +
      '引き続き市場調査であり、参加申込ではありません。';
  }
  function computeSurveyPath(values) {
    var uniform = hasUniformGate(values);
    var suit = hasSuitGate(values);
    if (uniform && suit) return 'uniform_and_suit';
    if (uniform) return 'uniform_only';
    if (suit) return 'suit_only';
    return 'none';
  }
  function computeCompletionStage(values) {
    var uniform = hasUniformGate(values);
    var suit = hasSuitGate(values);
    if (suit) return 'suit_interest';
    if (uniform) {
      if (values.snbcInterest === 'はい') return 'snbc_deep_dive';
      if (values.snbcInterest === 'どちらともいえない') return 'snbc_uncertain';
      if (values.snbcInterest === 'いいえ') return 'snbc_not_interested';
      return '';
    }
    return 'no_gate_reached';
  }

  var FREQUENCY_OPTIONS = [
    '月2回程度', '月1回程度', '1〜2か月に1回程度', '2〜3か月に1回程度',
    '半年に1回程度', '頻度はあまり関係ない', 'わからない'
  ];

  var PRICE_OPTIONS = [
    '2,000円以下', '2,500円程度', '3,000円程度', '3,500円程度',
    '4,000円程度', '5,000円程度', '内容によっては5,000円以上でもよい'
  ];

  var GROUP_SIZE_OPTIONS = [
    '3〜4人', '5〜6人', '7〜8人', '9〜10人', '11人以上', '人数はあまり気にならない'
  ];

  // 「個室で1対1」は個人セッション予約の募集だと誤認されるリスクが高いため使わず、
  // 「少人数の部屋で2人だけ」という、あくまで人数の目安としての表現に統一する
  // （Code.gs側のFORMAT_OPTIONSと必ず一致させること）。
  var FORMAT_OPTIONS = [
    '少人数の部屋で2人だけ',
    '3〜4人程度のごく少人数',
    '5〜6人程度の少人数',
    '7〜10人程度',
    '10人以上の交流会',
    'まず2人だけや少人数で知り合ってから、大人数にも参加したい',
    '知り合いと一緒なら大人数でも参加しやすい',
    '人数より、参加者の雰囲気や内容の方が重要',
    'わからない'
  ];

  var EVENT_AWARENESS_OPTIONS = [
    '見たことがあり、実際に参加したことがある',
    '見たことはあるが、申し込んだことはない',
    '申し込もうと思ったが見送ったことがある',
    '告知を見たことがない',
    '覚えていない'
  ];

  // 旧「どんな人が来るか分からなかった」は「参加者の雰囲気やタイプが分からなかった」と
  // ほぼ同義のため統合し後者に一本化。本音に近い項目を前半へ前倒し（Code.gs側の
  // BARRIER_OPTIONSと必ず一致させること）。
  var BARRIER_OPTIONS = [
    '日程が合わなかった', '開催時間が合わなかった', '開催場所が遠かった',
    '料金が高いと感じた', '一人参加が不安だった', '知り合いがいなかった',
    '自分の年齢や体型が、その場に合うか不安だった',
    '参加者の雰囲気やタイプが分からなかった',
    '参加者の年齢層が分からなかった',
    '常連同士ですでに仲良さそうに見えた',
    '自分の好きなジャンルと合うか不安だった',
    '内容が健全・真面目すぎて、参加するほどの魅力を感じなかった',
    '逆に、性的な雰囲気や接触に発展しそうで不安だった',
    '何をするイベントなのか分かりにくかった',
    '写真撮影が不安だった', 'SNS掲載が不安だった', '衣装を用意するのが面倒だった',
    '申し込み方法が面倒だった', '予定を早く決められなかった',
    '直前になると行く気がなくなった',
    '嫌なことを断ったときに気まずくなりそうだった',
    '興味はあるが、実際に参加するほどではなかった',
    '該当しない'
  ];

  // 旧「初参加者が何人いるか」と「初参加者がどの程度いるか」がほぼ同義で重複していたため
  // 前者に一本化（Code.gs側のHELPFUL_INFO_OPTIONSと必ず一致させること）。
  var HELPFUL_INFO_OPTIONS = [
    '参加予定人数', '参加者の年代', '一人参加者が何人いるか', '初参加者が何人いるか',
    '常連と初参加者の割合', '参加者の雰囲気や年代の目安',
    '当日の流れ', 'その回が交流中心か撮影中心か', 'どんな衣装の人が参加するか',
    '写真撮影のルール', 'SNS掲載ルール',
    '身体的接触の有無についてのルール', '嫌なことを断っても問題ないというルール',
    '会場の写真', '更衣・撮影スペースの使い方',
    '主催者についての情報', '過去開催の様子', '過去参加者の感想',
    'キャンセル規定', '初参加者が孤立しない進行方法',
    '特にない'
  ];

  // 「身体的接触への許容度」と「雰囲気・空気感の刺激度」を別軸として明確に切り分けた
  // （Code.gs側のATMOSPHERE_OPTIONSと必ず一致させること）。
  var ATMOSPHERE_OPTIONS = [
    '会話や衣装を楽しむことが中心',
    'フェチについて気軽に話せるが、身体的な接触はない',
    '撮影やポーズなど、少し踏み込んだ表現も楽しめる（接触は求めない）',
    '身体的な接触はなくても、雰囲気が少し刺激的な方が参加したくなる',
    'お互いの同意があれば、多少の身体的な接触を伴う交流もあってよい',
    '性的な雰囲気を感じる企画には参加しにくい',
    '事前に雰囲気が明確ならどちらでもよい',
    'わからない'
  ];

  var HYPOTHETICAL_INTENT_OPTIONS = [
    '日程が合えば申し込む可能性が高い', '内容や参加者を見てから決める',
    '興味はあるが、たぶん申し込まない', '参加しない', 'わからない'
  ];

  var GAP_OPTIONS = [
    'よくある', 'ときどきある', 'あまりない', 'ない', 'わからない'
  ];

  var GAP_REASON_OPTIONS = [
    'アンケートでは予定を具体的に考えていない', '実際の日程になると都合が合わない',
    '実際にお金を払う段階になると迷う', '知らない人と会うことに不安を感じる',
    '申し込み後に断りづらくなるのが嫌', '当日まで参加する気分が続くか不安',
    '興味を示すことと、実際に参加することは別だと思っている',
    '告知を詳しく見ると、自分が想像していた雰囲気と違った',
    '参加者の顔ぶれや雰囲気が分からず、申し込む決め手がなかった',
    '思ったより性的な方向に進みそうで不安になった',
    '逆に、わざわざ参加するほど魅力のある内容に見えなかった',
    'その場で嫌なことを断れる自信がなかった',
    '大人数より2人だけや少人数の方が自分には合っていると思った',
    '該当しない'
  ];

  var HYPOTHETICAL_CONDITION_TEXT = [
    '【条件（あくまで仮定です）】',
    '・3時間程度',
    '・5〜6名程度',
    '・参加費3,500円',
    '・一人参加可',
    '・会話・衣装・希望者の撮影を中心とし、本人の同意のない身体的接触は行わない',
    '・写真やSNS掲載は本人の了承なしでは行わない',
    '',
    'この条件での開催を決定・約束するものではありません。'
  ].join('\n');

  /* 設問定義。typeは 'select'（プルダウン単一選択）/ 'radio'（単一選択）/
     'checkbox'（複数選択）/ 'textarea'（自由記述）。
     condition(values) を指定した設問は、条件を満たす間だけ表示・収集する
     （非表示の間は空値として送信する＝サーバー側の制約と矛盾しないようにする）。
     optionGroups は選択肢を視覚的にブロック分けして表示する（checkboxのみ）。
     dynamicOptions(values) は選択肢をcurrentValuesから動的に組み立てる（primaryInterestCategoryのみ）。

     【Issue #293：分岐の実装方針】
     このフォームは元々「1枚の縦長ページに、条件を満たす設問だけを表示する」構成のため、
     STEP2/STEP2Bのようなページ単位の分岐にはせず、既存の仕組みを踏襲して
     hasUniformGate/hasSuitGate/deepDiveTriggeredをcondition()に渡す形で実装する。
     DOM上の並び順は「STEP1→STEP1A→STEP2→STEP3(深掘り)→STEP2B」で固定してあり、
     ユニフォーム系＋スーツの両方に該当する回答者は、画面をスクロールしていくと
     STEP2（該当すればSTEP3まで）が先に表示され、その後にSTEP2Bが現れる
     （STEP2をスキップしてSTEP2Bだけに進む場合も、この並び順の中でSTEP2側のカードが
     単に非表示になるだけなので、結果としてSTEP2Bへ直接進む）。 */
  var QUESTIONS = [
    /* ── STEP1：全回答者 ── */
    {
      key: 'prefecture', type: 'select', required: true,
      label: 'お住まいの都道府県を教えてください',
      options: PREFECTURES
    },
    {
      key: 'aichiArea', type: 'radio', required: true,
      label: 'お住まいの地域を教えてください',
      help: '愛知県を選んだ方のみの質問です。',
      options: AICHI_AREA_OPTIONS,
      condition: function (v) { return v.prefecture === '愛知県'; }
    },
    {
      key: 'age', type: 'radio', required: true,
      label: '年代を教えてください',
      options: AGE_OPTIONS
    },

    /* ── STEP1A：衣装・服装嗜好（分析の主） ── */
    {
      key: 'interestCategories', type: 'checkbox', required: true, allowOther: true,
      label: '興味のある衣装・服装・キャラクター表現を教えてください（複数回答可）',
      help: 'この設問を分析の主とします。次の「特に好きなジャンル」は補助的な位置づけとして扱います。',
      optionGroups: [
        { label: 'スポーツ・ユニフォーム系', options: INTEREST_SPORTS_OPTIONS },
        { label: '制服・職業服系', options: INTEREST_UNIFORM_JOB_OPTIONS },
        { label: 'コスプレ・キャラクター系', options: INTEREST_COSPLAY_OPTIONS }
      ]
    },
    {
      key: 'primaryInterestCategory', type: 'radio', required: false,
      label: '特に好きなジャンルを1つ選ぶとしたら、どれですか？',
      help: '直前の設問で選んだ項目だけが候補になります。あくまで補助的な質問のため、無回答でも構いません。',
      // 「その他」の自由記述は候補から除外する（dynamicOptionsと同じ判定基準にすること。
      // ここがconditionとずれると、Q4で「その他」しか選んでいない回答者に対して
      // 候補ゼロの空の選択肢カードを表示してしまう）。
      dynamicOptions: function (values) {
        return primaryInterestCandidates(values);
      },
      condition: function (v) { return primaryInterestCandidates(v).length > 0; }
    },
    {
      key: 'engagementPreferences', type: 'checkbox', required: true, allowOther: true,
      label: 'その衣装・服装とどう関わりたいですか？（複数回答可）',
      options: ENGAGEMENT_OPTIONS
    },

    /* ── STEP2：ユニフォーム系ゲート該当者のみ（Q4で選んだ項目から自動判定） ── */
    {
      key: 'snbcAwareness', type: 'radio', required: true,
      label: 'Studio Nagoya Base Community（SNBC）を知っていますか？',
      help: '名古屋・上前津のStudio Nagoya Baseを拠点に、ユニフォームなどをテーマにした交流・撮影企画を行っているコミュニティです。',
      options: SNBC_AWARENESS_OPTIONS,
      condition: function (v) { return hasUniformGate(v); }
    },
    {
      key: 'snbcInterest', type: 'radio', required: true,
      label: 'SNBC（Studio Nagoya Base Community）が行う、ユニフォームをテーマにした少人数の交流・撮影企画に興味がありますか？',
      help: '「参加しますか」ではなく「興味がありますか」をお聞きしています。回答いただいても参加表明にはなりません。',
      options: SNBC_INTEREST_OPTIONS,
      condition: function (v) { return hasUniformGate(v); }
    },
    {
      key: 'snbcInterestUncertainReasons', type: 'checkbox', required: false, allowOther: true,
      label: '「どちらともいえない」の理由に近いものがあれば教えてください（複数回答可・任意）',
      options: SNBC_UNCERTAIN_REASON_OPTIONS,
      condition: function (v) { return hasUniformGate(v) && v.snbcInterest === 'どちらともいえない'; }
    },

    /* ── STEP3：SNBCユニ会に興味ありの人だけ深掘り（PR #292由来、スーツ経由でも再利用） ── */
    {
      key: 'preferredFrequency', type: 'radio', required: true, group: 'deepDive',
      label: '名古屋市内で少人数のフェチ・衣装交流や撮影企画がある場合、どの程度の頻度なら参加を検討しやすいですか？',
      help: '「開催してほしい頻度」ではなく、「ご自身が参加を検討しやすい頻度」をお答えください。特定の頻度・日程での開催を約束するものではありません。',
      sectionNote: deepDiveIntroText, // 発火経路（ユニフォーム/スーツ/両方）に応じて文面を出し分ける
      options: FREQUENCY_OPTIONS,
      condition: function (v) { return deepDiveTriggered(v); }
    },
    {
      key: 'preferredPrice', type: 'radio', required: true, group: 'deepDive',
      label: '1回3時間程度の少人数企画を想定した場合、参加しやすい料金はいくらですか？',
      options: PRICE_OPTIONS,
      condition: function (v) { return deepDiveTriggered(v); }
    },

  ];

  /* ══════════════════════════════════════════════════════════════
   * ブラウザUUID：localStorage / Cookie 両方に保存し、片方が消えても復元できるようにする
   * ══════════════════════════════════════════════════════════════ */

  var UUID_STORAGE_KEY = 'survey_browser_uuid';
  var COOKIE_MAX_AGE_SECONDS = 60 * 60 * 24 * 400; // 約400日（主要ブラウザのCookie上限に合わせた「最低1年程度」の実質最大値）

  function generateUuid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return fallbackUuidV4();
  }

  // crypto.randomUUID()非対応ブラウザ向けフォールバック。
  // crypto.getRandomValues()（暗号学的乱数）が使える場合はそれを使い、
  // 完全に使えない極めて古い環境でのみMath.randomにフォールバックする。
  function fallbackUuidV4() {
    var bytes = new Uint8Array(16);
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
      window.crypto.getRandomValues(bytes);
    } else {
      for (var i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    bytes[6] = (bytes[6] & 0x0f) | 0x40; // version 4
    bytes[8] = (bytes[8] & 0x3f) | 0x80; // variant 10

    var hex = [];
    for (var j = 0; j < 256; j++) hex[j] = (j + 0x100).toString(16).slice(1);

    return (
      hex[bytes[0]] + hex[bytes[1]] + hex[bytes[2]] + hex[bytes[3]] + '-' +
      hex[bytes[4]] + hex[bytes[5]] + '-' +
      hex[bytes[6]] + hex[bytes[7]] + '-' +
      hex[bytes[8]] + hex[bytes[9]] + '-' +
      hex[bytes[10]] + hex[bytes[11]] + hex[bytes[12]] + hex[bytes[13]] + hex[bytes[14]] + hex[bytes[15]]
    );
  }

  function readLocalStorage(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      // プライベートブラウズ等でlocalStorageへのアクセス自体が例外になる環境がある。
      return null;
    }
  }

  function writeLocalStorage(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {
      // 書き込み失敗は無視する（Cookie側が代替として機能する場合がある）。
    }
  }

  function readCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function writeCookie(name, value) {
    // Apps ScriptのWebアプリは常時HTTPSで配信されるためSecureを付与できる。
    // SameSite=Laxはトップレベル遷移でのCookie送信を許可しつつCSRF的なリスクを抑える設定。
    var attrs = 'path=/; max-age=' + COOKIE_MAX_AGE_SECONDS + '; SameSite=Lax; Secure';
    document.cookie = name + '=' + encodeURIComponent(value) + '; ' + attrs;
  }

  /**
   * ブラウザUUIDの復元・発行ルール（仕様理由）：
   * 1. localStorageにUUIDがある → それを採用する。
   *    Cookie側の値と食い違っていても、新規UUIDは発行せずlocalStorage側を正としてCookieを同期する。
   *    （理由：Cookieは有効期限切れ・サードパーティCookie制限などで消えたり
   *    分離されたりしやすく、localStorageの方が同一ブラウザでの継続性が高いと判断したため。
   *    ここで新規UUIDを発行してしまうと、Cookieだけが何らかの理由で書き換わった
   *    ケースで毎回別人扱いになってしまう）。
   * 2. localStorageが空でCookieがある → Cookieの値を採用し、localStorageにも保存する
   *    （localStorageのみ消去された場合の復元）。
   * 3. 両方とも空 → 新規UUIDを生成し、両方に保存する。
   */
  function resolveBrowserUuid() {
    var localValue = readLocalStorage(UUID_STORAGE_KEY);
    var cookieValue = readCookie(UUID_STORAGE_KEY);

    if (localValue) {
      if (cookieValue !== localValue) {
        writeCookie(UUID_STORAGE_KEY, localValue);
      }
      return localValue;
    }

    if (cookieValue) {
      writeLocalStorage(UUID_STORAGE_KEY, cookieValue);
      return cookieValue;
    }

    var newUuid = generateUuid();
    writeLocalStorage(UUID_STORAGE_KEY, newUuid);
    writeCookie(UUID_STORAGE_KEY, newUuid);
    return newUuid;
  }

  /* ══════════════════════════════════════════════════════════════
   * フォーム描画
   * ══════════════════════════════════════════════════════════════ */

  var browserUuid = null;
  var currentValues = {}; // key -> string | string[]
  var fieldElements = {}; // key -> { card, inputs: [...], otherCheckbox, otherText, errorEl }

  /* STEP3（深掘り一式、group: 'deepDive'）は、ユニフォーム系ゲート経由（STEP2の直後）でも
     スーツ経由（STEP2Bの直後）でも同じ設問セットを再利用する。DOM上の並び順は固定のため、
     questionsContainer内で deepDiveContainer 自体を anchorUniformPos（STEP2直後の定位置）と
     anchorEnd（STEP2Bの後＝末尾）のどちらかへ、hasUniformGate()の値に応じて動かす
     （hasUniformGateがtrueなら常にSTEP2/3の定位置、falseならSTEP2Bの後ろ＝スーツ経由の
     位置。ユニフォーム系ゲート該当者はスーツも選んでいてもSTEP2/3が先に完走する設計のため）。 */
  var questionsContainer = null;
  var deepDiveContainer = null;
  var anchorUniformPos = null;
  var anchorEnd = null;

  /**
   * question.sectionNoteは固定文字列、または現在の回答からその場で文面を組み立てる
   * function(values)のいずれかを許容する（例：deepDiveIntroTextはユニフォーム/スーツ/
   * 両方のどの経路で発火したかにより文面を変える）。
   */
  function resolveSectionNote(question, values) {
    return typeof question.sectionNote === 'function' ? question.sectionNote(values) : question.sectionNote;
  }

  function initialValueFor(question) {
    if (question.type === 'checkbox') return [];
    return '';
  }

  QUESTIONS.forEach(function (q) {
    currentValues[q.key] = initialValueFor(q);
  });

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'text') node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  function renderQuestions() {
    var container = document.getElementById('questions');
    container.innerHTML = '';
    questionsContainer = container;
    deepDiveContainer = null;
    anchorUniformPos = null;
    anchorEnd = null;

    QUESTIONS.forEach(function (question, index) {
      var appendTarget = container;
      if (question.group === 'deepDive') {
        if (!deepDiveContainer) {
          // STEP2の直後（デフォルトの定位置）にアンカーとコンテナを作る。
          anchorUniformPos = el('div', { hidden: 'hidden' });
          container.appendChild(anchorUniformPos);
          deepDiveContainer = el('div', { id: 'deep-dive-group' });
          container.appendChild(deepDiveContainer);
        }
        appendTarget = deepDiveContainer;
      }

      var sectionNoteEl = null;
      var sectionNoteTextEl = null;
      if (question.sectionNote) {
        // data-section-note-forはテスト（jsdom）から表示状態を特定するための目印。
        // 表示ロジック自体はこの属性を参照しない。
        sectionNoteTextEl = el('p', { text: resolveSectionNote(question, currentValues) });
        sectionNoteEl = el('div', { class: 'notice-box', 'data-section-note-for': question.key }, [sectionNoteTextEl]);
        appendTarget.appendChild(sectionNoteEl);
      }

      var legend = el('legend', {}, [document.createTextNode(question.label)]);
      if (question.required) {
        legend.appendChild(el('span', { class: 'q-required', text: '必須' }));
      }

      var card = el('fieldset', { class: 'q-card', 'data-key': question.key });
      card.appendChild(legend);
      if (question.help) {
        card.appendChild(el('p', { class: 'q-help', text: question.help }));
      }

      var record = {
        card: card, inputs: [], otherCheckbox: null, otherText: null,
        sectionNoteEl: sectionNoteEl, sectionNoteTextEl: sectionNoteTextEl
      };

      if (question.type === 'select') {
        var select = el('select', { class: 'q-select', id: 'field-' + question.key });
        select.appendChild(el('option', { value: '' }, [document.createTextNode('選択してください')]));
        question.options.forEach(function (opt) {
          select.appendChild(el('option', { value: opt }, [document.createTextNode(opt)]));
        });
        select.addEventListener('change', function () {
          setValue(question.key, select.value);
        });
        card.appendChild(select);
        record.inputs.push(select);
      } else if (question.type === 'radio' || question.type === 'checkbox') {
        var inputType = question.type === 'radio' ? 'radio' : 'checkbox';
        var groupName = 'field-' + question.key;
        var groupsWrap = el('div', { class: 'q-options-groups' });
        var optionsWraps = [];
        var optionCounter = 0;

        if (question.dynamicOptions) {
          // primaryInterestCategoryのように、選択肢を他設問の回答から動的に組み立てる設問。
          // 実際の選択肢描画・再描画はrebuildDynamicOptions()（applyConditions内から呼ぶ）に任せる。
          var dynWrap = el('div', { class: 'q-options' });
          groupsWrap.appendChild(dynWrap);
          record.optionsWrap = dynWrap;
          record.groupName = groupName;
        } else {
          var optionGroups = question.optionGroups || [{ label: null, options: question.options }];
          optionGroups.forEach(function (group) {
            if (group.label) {
              groupsWrap.appendChild(el('p', { class: 'q-option-group-label', text: group.label }));
            }
            var optionsWrap = el('div', { class: 'q-options' });
            group.options.forEach(function (opt) {
              var input = el('input', {
                type: inputType,
                name: groupName,
                id: groupName + '-' + (optionCounter++),
                value: opt
              });
              input.addEventListener('change', function () { onOptionChange(question); });
              var label = el('label', { class: 'q-option', for: input.id }, [
                input, el('span', { text: opt })
              ]);
              optionsWrap.appendChild(label);
              record.inputs.push(input);
            });
            groupsWrap.appendChild(optionsWrap);
            optionsWraps.push(optionsWrap);
          });
        }

        if (question.allowOther) {
          var otherWrap = optionsWraps.length ? optionsWraps[optionsWraps.length - 1] : el('div', { class: 'q-options' });
          if (!optionsWraps.length) groupsWrap.appendChild(otherWrap);
          var otherInput = el('input', {
            type: inputType,
            name: groupName,
            id: groupName + '-other',
            value: OTHER_VALUE
          });
          otherInput.addEventListener('change', function () {
            otherText.disabled = !otherInput.checked;
            if (!otherInput.checked) otherText.value = '';
            onOptionChange(question);
          });
          var otherLabel = el('label', { class: 'q-option', for: otherInput.id }, [
            otherInput, el('span', { text: 'その他' })
          ]);
          otherWrap.appendChild(otherLabel);
          record.inputs.push(otherInput);
          record.otherCheckbox = otherInput;

          var otherText = el('input', {
            type: 'text',
            class: 'q-other-text',
            maxlength: '100',
            placeholder: '自由にご記入ください',
            disabled: 'disabled'
          });
          otherText.addEventListener('input', function () { onOptionChange(question); });
          record.otherText = otherText;
          card.appendChild(groupsWrap);
          card.appendChild(otherText);
        } else {
          card.appendChild(groupsWrap);
        }
      } else if (question.type === 'textarea') {
        var textarea = el('textarea', {
          class: 'q-textarea',
          id: 'field-' + question.key,
          maxlength: '300'
        });
        textarea.addEventListener('input', function () {
          setValue(question.key, textarea.value);
        });
        card.appendChild(textarea);
        record.inputs.push(textarea);
      }

      var errorEl = el('p', { class: 'q-error', text: 'この項目は必須です。' });
      card.appendChild(errorEl);
      record.errorEl = errorEl;

      fieldElements[question.key] = record;
      appendTarget.appendChild(card);
    });

    anchorEnd = el('div', { hidden: 'hidden' });
    container.appendChild(anchorEnd);

    applyConditions();
  }

  function onOptionChange(question) {
    if (question.type === 'radio') {
      var record = fieldElements[question.key];
      var selected = record.inputs.filter(function (i) { return i.checked; })[0];
      if (!selected) {
        setValue(question.key, '');
      } else if (question.allowOther && selected === record.otherCheckbox) {
        setValue(question.key, OTHER_PREFIX + record.otherText.value.trim());
      } else {
        setValue(question.key, selected.value);
      }
    } else if (question.type === 'checkbox') {
      var rec = fieldElements[question.key];
      var values = [];
      rec.inputs.forEach(function (input) {
        if (!input.checked) return;
        if (question.allowOther && input === rec.otherCheckbox) {
          values.push(OTHER_PREFIX + rec.otherText.value.trim());
        } else {
          values.push(input.value);
        }
      });
      setValue(question.key, values);
    }
  }

  /**
   * すべての値変更（select/radio/checkbox/textareaいずれも）はここを経由するため、
   * 条件付き表示（applyConditions）の再評価も常にここで行う。
   * select（都道府県）の変更でaichiAreaの表示条件が変わるケースを取りこぼさないよう、
   * 個々のイベントハンドラ側では呼ばずここに一本化している。
   */
  function setValue(key, value) {
    currentValues[key] = value;
    clearFieldError(key);
    applyConditions();
  }

  /**
   * condition() を持つ設問（aichiArea / snbcAwareness / preferredFrequency 等）の
   * 表示・非表示を切り替える。非表示にする際は入力値も初期値へ戻す
   * （画面から消えた設問の古い値が送信されないようにするため）。
   * dynamicOptions を持つ設問（primaryInterestCategory）は、表示・非表示の判定より前に
   * 選択肢自体を最新のcurrentValuesから再構築する。
   */
  function applyConditions() {
    QUESTIONS.forEach(function (question) {
      if (question.dynamicOptions) rebuildDynamicOptions(question);
      if (!question.condition) return;
      var visible = question.condition(currentValues);
      var record = fieldElements[question.key];
      record.card.hidden = !visible;
      // sectionNote（STEP見出しの案内文）はcondition付き設問のカードと同じ表示条件で
      // 出し入れする。ここを怠ると、設問カード自体は隠れているのに見出し文だけ
      // 全回答者に見えてしまう（例：ユニフォーム系ゲート非該当者にもSTEP3の案内文が出る）。
      if (record.sectionNoteEl) {
        record.sectionNoteEl.hidden = !visible;
        // 文面が発火経路（ユニフォーム/スーツ/両方）で変わる設問（deepDiveIntroText）のため、
        // 表示するたびに現在のcurrentValuesから文面を再計算する。
        if (visible && record.sectionNoteTextEl) {
          record.sectionNoteTextEl.textContent = resolveSectionNote(question, currentValues);
        }
      }
      if (!visible) {
        resetFieldInputs(question);
        currentValues[question.key] = initialValueFor(question);
        clearFieldError(question.key);
      }
    });

    repositionDeepDiveGroup();
  }

  /**
   * STEP3（深掘り一式）のDOM位置を、回答者の経路に応じて動かす。
   * ユニフォーム系ゲート該当者（スーツも選んでいる場合を含む）は常にSTEP2直後の定位置
   * （anchorUniformPos）に固定し、スーツのみ選択している回答者（ユニフォーム系ゲート
   * 非該当）でsuit_event_interest=はいにより深掘りが発火した場合だけ、STEP2Bの後ろ
   * （anchorEnd直前）へ移動する。こうしないと、スーツのみの回答者がS4で「はい」と
   * 答えたときに、深掘りの設問群が画面のずっと上（未回答のS1〜S4より前）に
   * 突然現れてしまう。
   */
  function repositionDeepDiveGroup() {
    if (!deepDiveContainer) return;
    var visible = deepDiveTriggered(currentValues);
    deepDiveContainer.hidden = !visible;
    if (!visible) return;

    if (hasUniformGate(currentValues)) {
      questionsContainer.insertBefore(deepDiveContainer, anchorUniformPos.nextSibling);
    } else {
      questionsContainer.insertBefore(deepDiveContainer, anchorEnd);
    }
  }

  /**
   * dynamicOptions(values)を持つ設問（primaryInterestCategory）の選択肢を
   * 最新のcurrentValuesから再構築する。選択済みの値が新しい候補に含まれなくなった場合は
   * 選択を解除する（Q4の選択を変えてQ5の候補から外れた項目を選んだままにしないため）。
   */
  function rebuildDynamicOptions(question) {
    var record = fieldElements[question.key];
    var options = question.dynamicOptions(currentValues);
    var previousValue = currentValues[question.key];
    var stillValid = options.indexOf(previousValue) !== -1;

    record.optionsWrap.innerHTML = '';
    record.inputs = [];
    options.forEach(function (opt, i) {
      var input = el('input', {
        type: 'radio',
        name: record.groupName,
        id: record.groupName + '-dyn-' + i,
        value: opt
      });
      if (stillValid && opt === previousValue) input.checked = true;
      input.addEventListener('change', function () { onOptionChange(question); });
      var label = el('label', { class: 'q-option', for: input.id }, [input, el('span', { text: opt })]);
      record.optionsWrap.appendChild(label);
      record.inputs.push(input);
    });

    if (!stillValid && previousValue !== '') {
      currentValues[question.key] = '';
    }
  }

  function resetFieldInputs(question) {
    var record = fieldElements[question.key];
    record.inputs.forEach(function (input) {
      if (input.type === 'radio' || input.type === 'checkbox') input.checked = false;
      else input.value = '';
    });
    if (record.otherText) {
      record.otherText.value = '';
      record.otherText.disabled = true;
    }
  }

  function clearFieldError(key) {
    var record = fieldElements[key];
    if (record) record.card.classList.remove('q-card--invalid');
  }

  /* ══════════════════════════════════════════════════════════════
   * バリデーション・送信データの組み立て
   * ══════════════════════════════════════════════════════════════ */

  function isQuestionVisible(question) {
    return !question.condition || question.condition(currentValues);
  }

  function validateForm() {
    var firstInvalidCard = null;

    QUESTIONS.forEach(function (question) {
      var record = fieldElements[question.key];
      record.card.classList.remove('q-card--invalid');
      if (!question.required || !isQuestionVisible(question)) return;

      var value = currentValues[question.key];
      var invalid = question.type === 'checkbox' ? value.length === 0 : value === '';

      // 「その他」を選んだのに自由記述が空、も不正として扱う。
      if (!invalid && record.otherCheckbox && record.otherCheckbox.checked && record.otherText.value.trim() === '') {
        invalid = true;
      }

      if (invalid) {
        record.card.classList.add('q-card--invalid');
        if (!firstInvalidCard) firstInvalidCard = record.card;
      }
    });

    // 必須ではない設問でも、「その他」を選んだのに自由記述が空の場合は不正とする。
    QUESTIONS.forEach(function (question) {
      if (question.required || !isQuestionVisible(question)) return;
      var record = fieldElements[question.key];
      if (record.otherCheckbox && record.otherCheckbox.checked && record.otherText.value.trim() === '') {
        record.card.classList.add('q-card--invalid');
        if (!firstInvalidCard) firstInvalidCard = record.card;
      }
    });

    if (firstInvalidCard) {
      // 古いWebView等でscrollIntoViewが無い場合でも送信ブロック自体は成立させる
      // （ここで例外になるとvalidateForm()全体が失敗し、意図せず送信されてしまうため）。
      if (typeof firstInvalidCard.scrollIntoView === 'function') {
        try {
          firstInvalidCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (scrollError) {
          firstInvalidCard.scrollIntoView();
        }
      }
      return false;
    }
    return true;
  }

  function buildAnswersPayload() {
    return {
      prefecture: currentValues.prefecture,
      aichiArea: currentValues.aichiArea,
      age: currentValues.age,
      interestCategories: currentValues.interestCategories,
      primaryInterestCategory: currentValues.primaryInterestCategory,
      engagementPreferences: currentValues.engagementPreferences,
      snbcAwareness: currentValues.snbcAwareness,
      snbcInterest: currentValues.snbcInterest,
      snbcInterestUncertainReasons: currentValues.snbcInterestUncertainReasons,
      suitEngagementPreferences: currentValues.suitEngagementPreferences,
      suitTypes: currentValues.suitTypes,
      suitStates: currentValues.suitStates,
      suitEventInterest: currentValues.suitEventInterest,
      preferredFrequency: currentValues.preferredFrequency,
      preferredPrice: currentValues.preferredPrice,
      preferredGroupSize: currentValues.preferredGroupSize,
      preferredFormat: currentValues.preferredFormat,
      eventAwareness: currentValues.eventAwareness,
      barriers: currentValues.barriers,
      helpfulInformation: currentValues.helpfulInformation,
      preferredAtmosphere: currentValues.preferredAtmosphere,
      hypotheticalIntent: currentValues.hypotheticalIntent,
      surveyToSignupGap: currentValues.surveyToSignupGap,
      gapReasons: currentValues.gapReasons,
      freeComment: currentValues.freeComment,
      surveyPath: computeSurveyPath(currentValues),
      completionStage: computeCompletionStage(currentValues)
    };
  }

  /* ══════════════════════════════════════════════════════════════
   * 画面状態の切り替え
   * ══════════════════════════════════════════════════════════════ */

  function showOnly(id) {
    ['loading', 'already-answered', 'load-error', 'submitted', 'survey-form'].forEach(function (elementId) {
      document.getElementById(elementId).hidden = elementId !== id;
    });
  }

  function setFormError(message) {
    var errorEl = document.getElementById('form-error');
    if (message) {
      errorEl.textContent = message;
      errorEl.hidden = false;
    } else {
      errorEl.hidden = true;
      errorEl.textContent = '';
    }
  }

  /* ══════════════════════════════════════════════════════════════
   * 起動処理
   * ══════════════════════════════════════════════════════════════ */

  function init() {
    try {
      renderQuestions();
      browserUuid = resolveBrowserUuid();
    } catch (renderError) {
      // フォーム描画やUUID解決自体で例外が起きると「読み込み中」のまま止まってしまうため、
      // ここだけは明示的にエラー表示へ切り替える。
      showOnly('load-error');
      return;
    }

    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.answered) {
          showOnly('already-answered');
        } else {
          showOnly('survey-form');
        }
      })
      .withFailureHandler(function () {
        // 状態確認自体が失敗しても、最終的な二重回答防止はsubmitSurvey側のサーバー判定が
        // 担保するため、フォームは表示する（ユーザーを不必要にブロックしない）。
        showOnly('survey-form');
      })
      .checkSubmissionStatus(browserUuid);
  }

  function onSubmit(event) {
    event.preventDefault();
    setFormError('');

    if (!validateForm()) return;

    var submitButton = document.getElementById('submit-button');
    submitButton.disabled = true;
    submitButton.textContent = '送信中…';

    // サーバーからSUCCESS / DUPLICATE / ERRORのいずれかが返るまで、
    // ボタンを無効化したまま再送信を防ぐ（通常の二重クリック対策）。
    // 最終的な重複判定はサーバー側のLockService内で必ず行われる。
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.status === 'SUCCESS') {
          showOnly('submitted');
        } else if (result && result.status === 'DUPLICATE') {
          showOnly('already-answered');
        } else {
          submitButton.disabled = false;
          submitButton.textContent = '回答を送信する';
          setFormError('送信できませんでした。入力内容をご確認のうえ、もう一度お試しください。');
        }
      })
      .withFailureHandler(function () {
        submitButton.disabled = false;
        submitButton.textContent = '回答を送信する';
        setFormError('通信エラーが発生しました。時間をおいて再度お試しください。');
      })
      .submitSurvey(browserUuid, buildAnswersPayload());
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('survey-form').addEventListener('submit', onSubmit);
    init();
  });
})();
</script>
