<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- ID token を扱う管理ページ。外部スクリプトは Google Identity Services のみ許可し、インラインスクリプトは置かない。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; connect-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>衣装・ポートレート意識調査｜管理ダッシュボード</title>
  <link rel="stylesheet" href="costume-portrait-survey-admin/admin.css">
</head>
<body>
  <section id="login-view" class="login">
    <h1>衣装・ポートレート意識調査</h1>
    <p class="sub">管理ダッシュボード（関係者限定）</p>
    <p id="login-message" role="status">Googleアカウントでログインしてください。</p>
    <div id="gis-button"></div>
  </section>

  <section id="dashboard-view" hidden>
    <header class="top">
      <div class="top-row">
        <div>
          <h1>衣装・ポートレート意識調査</h1>
          <p class="sub">管理ダッシュボード（読み取り専用・非公開） <span id="role" class="note"></span></p>
        </div>
        <button type="button" id="logout" class="logout">ログアウト</button>
      </div>
      <nav id="tabs" class="tabs" role="tablist" aria-label="表示切替"></nav>
    </header>
    <main>
      <p id="status" role="status"></p>
      <div id="panels"></div>
    </main>
  </section>

  <script src="costume-portrait-survey-admin/config.js"></script>
  <script src="costume-portrait-survey-admin/admin.js"></script>
</body>
</html>
