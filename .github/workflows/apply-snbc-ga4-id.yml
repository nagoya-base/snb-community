name: Apply SNBC GA4 measurement ID

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-snbc-ga4-id.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ga4-measurement-refactor-87bol9
          fetch-depth: 0
      - name: Replace SNBC measurement ID
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'G-8K1TJG0S9Y'
          new = 'G-H9BD3KFZCR'
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No files contained the old SNBC measurement ID')
          print('\n'.join(changed))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ga4): set SNBC measurement ID"
          git push origin HEAD:claude/ga4-measurement-refactor-87bol9
