name: Baseball uniform survey schema

# Issue #378「名古屋野球ユニ部アンケート v2.17 schema正本」の参照整合テスト。
# schema の parse / 参照整合 validation / v2.17 回帰テストを PR ごとに実行する。
# 既存 costume portrait survey の workflow / schema / core / tests とは独立。
# deploy は行わない（Public GAS の deploy workflow は baseball-uniform-survey-public-gas.yml）。secret も使わない。

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/baseball-uniform-survey-schema.yml'
      - 'baseball/gas/baseball_uniform_survey/**'
      - 'baseball/baseball-uniform-survey.html'
      - 'baseball/baseball-uniform-survey/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-uniform-survey-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Validate survey.schema.json (design v2.17)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies (npm ci, lockfile only)
        working-directory: baseball/gas/baseball_uniform_survey
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse and validate survey.schema.json
        working-directory: baseball/gas/baseball_uniform_survey
        run: npm run validate
      - name: Run schema tests (reference integrity and v2.17 regressions)
        working-directory: baseball/gas/baseball_uniform_survey
        run: npm test
