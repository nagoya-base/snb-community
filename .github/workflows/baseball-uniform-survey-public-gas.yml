name: Baseball uniform survey Public GAS

# Issue #380「名古屋野球ユニ部アンケート Public GAS」のCI / デプロイ。
# 他の survey（fetish / costume portrait）の workflow / script / Environment / Secret とは独立。
#  - Pull request: テスト・生成物の差分検査・配備バンドルの dry-run のみ（本番 deployment は更新しない。secret も使わない）。
#  - workflow_dispatch (main 限定・デプロイ対象は実行開始時点の main HEAD = github.sha): テスト → deploy ジョブ（Environment 承認）。
#    production deploy は明示操作でのみ実行される（push / schedule では動かない）。
#  - 初回の GAS プロジェクト作成・Web App deployment 作成・OAuth 承認・Script Properties 設定は手動（README 参照）。以降は既存 deployment を更新する。
#  - 受付期間（opens_at / closes_at）は survey.config.json が正本。Script Properties には置かない。

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/baseball-uniform-survey-public-gas.yml'
      - 'baseball/gas/baseball_uniform_survey/**'
      - 'scripts/baseball-uniform-survey/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-uniform-survey-public-gas-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate and dry-run the public GAS bundle
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch from the main branch (fail closed)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Manual deployment must be dispatched from the main branch.' >&2
            exit 1
          fi
      - name: Check out code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate survey.schema.json
        working-directory: baseball/gas/baseball_uniform_survey
        run: npm run validate
      - name: Check the generated Public GAS file against schema, config and core
        working-directory: baseball/gas/baseball_uniform_survey
        run: npm run build:check
      - name: Run survey tests (schema, core, Public GAS, deploy scripts)
        working-directory: baseball/gas/baseball_uniform_survey
        run: npm test
      - name: Validate the allowlisted public bundle without GAS access (dry-run)
        run: |
          set -euo pipefail
          bundle="$(mktemp -d "$RUNNER_TEMP/baseball-uniform-survey-dry-run.XXXXXXXX")/out"
          BASEBALL_UNIFORM_SURVEY_SCRIPT_ID='dry-run-only' node scripts/baseball-uniform-survey/prepare-gas.js stage "$GITHUB_WORKSPACE" "$bundle"
          BUNDLE="$bundle" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { FILES, REQUIRED_SCOPES } = require('./scripts/baseball-uniform-survey/prepare-gas');
          const config = JSON.parse(fs.readFileSync(path.join(process.env.BUNDLE, '.clasp.json')));
          const actual = fs.readdirSync(process.env.BUNDLE).filter(n => !n.startsWith('.')).sort();
          const expected = [...FILES, 'appsscript.json'].sort();
          if (config.scriptId !== 'dry-run-only' || config.rootDir !== '.' || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Unexpected clasp rootDir or staged files.');
          }
          const manifest = JSON.parse(fs.readFileSync(path.join(process.env.BUNDLE, 'appsscript.json')));
          if (JSON.stringify([...manifest.oauthScopes].sort()) !== JSON.stringify([...REQUIRED_SCOPES].sort())) {
            throw new Error('Unexpected OAuth scopes.');
          }
          if (manifest.webapp !== undefined) throw new Error('The public bundle must not define Web App settings.');
          console.log('Dry-run bundle contains only the approved public GAS files.');
          NODE

  deploy:
    name: Update the existing public Web App deployment
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    # 手動作成する GitHub Environment。main 限定・承認者あり・この GAS 専用の Secret をここに登録する（README 参照）。
    environment: baseball-uniform-survey-public-production
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      BASEBALL_UNIFORM_SURVEY_SCRIPT_ID: ${{ secrets.BASEBALL_UNIFORM_SURVEY_SCRIPT_ID }}
      BASEBALL_UNIFORM_SURVEY_DEPLOYMENT_ID: ${{ secrets.BASEBALL_UNIFORM_SURVEY_DEPLOYMENT_ID }}
      BASEBALL_UNIFORM_SURVEY_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the pinned main HEAD (github.sha)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned clasp (npm ci, lockfile only)
        working-directory: scripts/baseball-uniform-survey
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Put the pinned clasp on PATH
        run: echo "$GITHUB_WORKSPACE/scripts/baseball-uniform-survey/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Push files, create version and update only the existing deployment
        shell: bash
        run: bash scripts/baseball-uniform-survey/deploy-gas.sh
