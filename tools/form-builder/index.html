<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>フォームジェネレーター（運営用）｜SNBコミュニティ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="fb-header">
    <h1>フォームジェネレーター</h1>
    <p class="fb-header__note">運営内部ツール。公開サイトの通常ナビゲーションには掲載していません。</p>
  </header>

  <nav class="fb-steps" id="fb-steps" aria-label="手順">
    <button type="button" class="fb-step" data-step="template">1. テンプレート</button>
    <button type="button" class="fb-step" data-step="edit">2. 入力</button>
    <button type="button" class="fb-step" data-step="preview">3. プレビュー</button>
    <button type="button" class="fb-step" data-step="publish">4. PR作成</button>
  </nav>

  <main id="fb-main" class="fb-main"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
